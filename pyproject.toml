[project]
name = "fairgate"
version = "0.1.0"
description = "Motor de contratos de equidad (QA Gates) para pipelines de aprendizaje supervisado"
license = { text = "MIT" }
readme = "README.md"
authors = [{ name = "Sergio Chumbimuni" }]
requires-python = ">=3.11,<3.12"
# Versiones exactas en requirements.lock.txt (reproducibilidad local y en CI, ADR-009).
dependencies = [
    "numpy",
    "pandas",
    "scikit-learn",
    "scipy",
    "fairlearn",
    "pandera",
    "pydantic>=2",
    "pyyaml",
    "mlflow",
    "rdflib",
    "pyshacl",
    "reportlab",
    "shap",
]

[project.optional-dependencies]
dev = ["pytest", "dvc"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["fairgate*"]

[tool.setuptools.package-data]
"fairgate.semantic" = ["*.ttl"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]  # paquete experiments/ (O4), que no se instala
addopts = "-ra"
filterwarnings = ["ignore::DeprecationWarning", "ignore::FutureWarning", "ignore::PendingDeprecationWarning:shap.*"]
