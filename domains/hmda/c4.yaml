contract_id: C4
version: "1.0"
gate: QA_GATE_4
stage: lotes_produccion
dataset: hmda
protected_attributes:
  - name: Sex
    groups: [Male, Female]          # "Joint" y "No disponible" no pertenecen a ningún grupo
    unprivileged: Female
    source_columns: [Sex]
    use_as_feature: false
  - name: Race
    groups: [White, Black]
    unprivileged: Black
    source_columns: [Race]
    use_as_feature: false
  - name: Age_group
    column: Age
    groups: {"65+": ["65-74", ">74"], "<65": ["<25", "25-34", "35-44", "45-54", "55-64"]}
    unprivileged: "65+"             # el regulador publica la edad en rangos; 62 años no es un corte disponible
    source_columns: [Age]
    use_as_feature: false
rules:
  # Deriva de datos: solo se registra (ADR-010). Umbral de diseño, aún sin calibrar.
  - {id: C4-DRIFT, metric: drift_share, operator: le, threshold: 0.30, severity: warn}
  # Deriva del sesgo: las reglas del C3 recalculadas sobre cada lote; bloquea -> Trigger CT.
  - {id: C4-SPD, metric: spd, operator: le, threshold: 0.10, severity: block}
  - {id: C4-EOD, metric: eod, operator: le, threshold: 0.10, severity: block}
  - {id: C4-DI, metric: di, operator: ge, threshold: 0.80, severity: block}
# El C4 alerta solo con evidencia de incumplimiento: todo el intervalo cruza el umbral (ADR-017).
# Con el peor extremo, el escenario de control bloqueaba casi todos los lotes de menos de 1 742 registros.
statistics: {method: bootstrap, n_resamples: 500, confidence: 0.95, decide_on: best_bound, random_state: 42}
params:
  stattest_threshold: 0.1   # distancias de Wasserstein y Jensen-Shannon (criterio de Evidently, ADR-016)
  batches: 4                # operación simulada: particiones del conjunto de prueba (Cap. 4, 4.5.5)
  reason_top_k: 3           # factores principales (SHAP) por solicitante rechazado; 0 = sin razones (PC3)
tooling: scipy
